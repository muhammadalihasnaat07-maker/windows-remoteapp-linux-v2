# Documentation: https://github.com/dockur/windows
# For valid VERSION values, visit:
#   https://github.com/dockur/windows?tab=readme-ov-file#how-do-i-select-the-windows-version
#   https://github.com/dockur/windows?tab=readme-ov-file#how-do-i-install-a-custom-image

name: "winapps" # Docker Compose project name.

volumes:
  # Named volume used as the Windows C: drive.
  # Docker:  /var/lib/docker/volumes/winapps_data/_data
  # Podman:  ~/.local/share/containers/storage/volumes/winapps_data/_data
  data:

services:
  windows:
    image: ghcr.io/dockur/windows:latest
    container_name: WinApps # Container name referenced by the launcher.

    environment:
      VERSION:    "${WINDOWS_VERSION:-11}"           # Windows version to install.
      RAM_SIZE:   "${WINDOWS_RAM:-4G}"               # RAM allocated to the Windows VM.
      CPU_CORES:  "${WINDOWS_CPUS:-4}"               # CPU cores allocated to the Windows VM.
      DISK_SIZE:  "${WINDOWS_DISK:-64G}"             # Primary virtual disk size.
      # DISK2_SIZE: "${WINDOWS_DISK2:-32G}"          # Uncomment to add a second virtual disk.
      USERNAME:   "${WINDOWS_USERNAME:-MyWindowsUser}"         # Windows login username.
      PASSWORD:   "${WINDOWS_PASSWORD:-ChangeThisPassword}"    # Windows login password.
      HOME:       "${HOME}"                          # Linux home path passed to the container.

    ports:
      # Bind only to loopback — change to 0.0.0.0 to expose on LAN.
      - "127.0.0.1:8006:8006"        # VNC web console at http://127.0.0.1:8006
      - "127.0.0.1:3389:3389/tcp"    # RDP (TCP)
      - "127.0.0.1:3389:3389/udp"    # RDP (UDP)
      # To expose RDP on the local network, comment the three lines above and uncomment:
      # - 3389:3389/tcp
      # - 3389:3389/udp

    cap_add:
      - NET_ADMIN # Required for container networking.

    stop_grace_period: 120s  # Allow Windows time to shut down cleanly before SIGTERM.
    restart: on-failure      # Restart only on error exit codes, not on intentional stop.

    volumes:
      - data:/storage                    # Windows C: drive.
      - "${HOME}:/shared"                # Linux home exposed inside Windows at \\host.lan\Data
      - ./oem:/oem                       # OEM scripts applied automatically after installation.
      # - /path/to/second/disk:/storage2 # Uncomment with DISK2_SIZE for a second virtual disk.
      # - /path/to/windows.iso:/custom.iso # Uncomment to supply a custom ISO (ignores VERSION).

    devices:
      - /dev/kvm       # KVM hardware acceleration (required).
      - /dev/net/tun   # TUN/TAP for container networking.
      # To pass through a physical disk, use persistent identifiers:
      # WARNING: /dev/sdX paths can change after reboot — prefer /dev/disk/by-id/
      # NOTE: disk1 is used as the main Windows drive and WILL BE FORMATTED.
      #       disk2 and beyond are NOT formatted automatically.
      # - /dev/disk/by-id/<your-disk-id>:/disk1
      # - /dev/disk/by-id/<your-disk-id>:/disk2

    # Rootless Podman only — uncomment both lines and install crun:
    # group_add:
    #   - keep-groups
